# Full nginx config for the Base44 dev environment (not a conf.d snippet).
#
# `user root` is required: the bind-mounted repository root is mode 700, and the
# default unprivileged nginx worker cannot traverse it (everything 403/404).
# sendfile is off so every request re-reads the file from the bind mount and
# source edits are picked up on the next refresh.

user  root;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    sendfile    off;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;
        autoindex off;

        # Never serve repo internals (git history, compose file, agent docs)
        location ~ /\. { deny all; }
        location ~* \.(ya?ml|md)$ { deny all; }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store" always;
        }
    }
}
