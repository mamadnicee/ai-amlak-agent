# Full nginx config for the Base44 dev environment (not a conf.d snippet).
#
# `user root` is required: the bind-mounted repository root is mode 700, and the
# default unprivileged nginx worker cannot traverse it (everything 403/404).
# `sendfile off` makes every request re-read the file from the bind mount, so
# source edits are live on the next refresh.
#
# API-key-bearing proxy locations are rendered at container start from
# nginx-prices.conf.template (the nginx image's envsubst support, output dir
# overridden via NGINX_ENVSUBST_OUTPUT_DIR) and included inside the server
# block below. Keys therefore stay server-side: the browser only ever talks to
# this same origin.

user  root;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    sendfile    off;
    keepalive_timeout  65;

    # Shared cache for the rate proxies (see nginx-prices.conf.template). One
    # upstream call serves every client and tab until the entry expires, which is
    # what keeps the provider quotas alive while the page polls.
    proxy_cache_path /var/cache/nginx/prices levels=1:2 keys_zone=prices:1m
                     max_size=8m inactive=2h use_temp_path=off;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;
        autoindex off;

        # Never serve repo internals (git history, compose file, agent docs)
        location ~ /\. { deny all; }
        location ~* \.(ya?ml|md|template)$ { deny all; }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store" always;
        }

        # Rate proxies with the API keys injected from /run/base44/app.env.
        include /etc/nginx/generated/*.conf;
    }
}
